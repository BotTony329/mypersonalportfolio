name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-deploy from the Actions tab without pushing a commit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; queue instead of cancelling a live publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # enablement:true turns Pages on for the repo the first time this runs,
      # so there is no manual step in Settings
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
